[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "vothmo"
version = "0.0.1"
description = "Visualizaci\u00f3n de Datos de Votantes"
authors = [
  { name = "David" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "bs4>=0.0.2",
    "cchardet>=2.4.0",
    "dash>=4.4.1",
    "dash-mantine-components>=2.8.1",
    "geopandas>=1.2.0",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "lxml>=6.1.3",
    "matplotlib>=3.11.2",
    "nbconvert>=7.16.6",
    "nbformat>=5.10.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pip",
    "plotly>=7.1.0",
    "pyogrio>=0.13.0",
    "python-dotenv",
    "requests>=2.34.2",
    "ruff",
    "shapely>=2.1.2",
    "streamlit>=1.66.1",
    "yarl>=1.25.1",
]
requires-python = "~=3.14.0"


[tool.ruff]
line-length = 99
src = ["vothmo"]
include = ["pyproject.toml", "vothmo/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["vothmo"]
force-sort-within-sections = true

