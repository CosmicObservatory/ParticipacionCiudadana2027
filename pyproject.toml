[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "partciud"
version = "0.0.1"
description = "Estimaci\u00f3n de Personas Votantes para las elecciones de 2027."
authors = [
  { name = "David Pe\u00f1a Perlalta" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "bs4>=0.0.2",
    "ipykernel>=7.4.0",
    "lxml>=6.1.3",
    "pip",
    "python-dotenv",
    "requests>=2.34.2",
    "ruff",
    "yarl>=1.25.1",
]
requires-python = "~=3.14.0"


[tool.ruff]
line-length = 99
src = ["partciud"]
include = ["pyproject.toml", "partciud/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["partciud"]
force-sort-within-sections = true

